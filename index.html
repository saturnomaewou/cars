<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a1f2b">
<title>Drift City</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ MENU ============ -->
<div id="menu-screen" class="screen">
  <div class="menu-wrap">
    <div class="logo">DRIFT<span>·</span>CITY</div>
    <div class="tagline">Circuito Urbano</div>

    <div>
      <div class="section-title">Modo</div>
      <div class="btn-row" id="mode-btns">
        <button class="btn active" data-mode="1">1 Jogador</button>
        <button class="btn" data-mode="2">2 Jogadores</button>
      </div>
    </div>

    <div>
      <div class="section-title">Dificuldade</div>
      <div class="btn-row" id="diff-btns"></div>
    </div>

    <div>
      <div class="section-title">Carro — P1</div>
      <div class="car-grid" id="car-grid-p1"></div>
    </div>

    <div id="p2-section" hidden>
      <div class="section-title">Carro — P2</div>
      <div class="car-grid" id="car-grid-p2"></div>
    </div>

    <button class="start-btn" id="start-btn">INICIAR CORRIDA</button>
  </div>
</div>

<!-- ============ RACE ============ -->
<div id="race-screen" class="screen" hidden>
  <canvas id="game-canvas"></canvas>
  <button id="pause-btn" title="Pausar">⏸</button>
  <div id="mobile-controls">
    <button class="mbtn mbtn-steerL"   data-act="steerL">◀</button>
    <button class="mbtn mbtn-steerR"   data-act="steerR">▶</button>
    <button class="mbtn mbtn-handbrake" data-act="handbrake">DRIFT</button>
    <button class="mbtn mbtn-brake"     data-act="brake">FREIO</button>
    <button class="mbtn mbtn-throttle"  data-act="throttle">ACEL</button>
  </div>
</div>

<!-- ============ RESULTS ============ -->
<div id="results-screen" class="screen" hidden>
  <div class="results-wrap">
    <h1>RESULTADOS</h1>
    <div id="results-list"></div>
    <div class="btn-row">
      <button class="btn" id="rematch-btn">CORRER NOVAMENTE</button>
      <button class="btn" id="menu-btn">MENU</button>
    </div>
  </div>
</div>

<div id="gyro-hint"></div>

<script src="mobile-controls.js"></script>
<script src="game.js"></script>
</body>
</html>
